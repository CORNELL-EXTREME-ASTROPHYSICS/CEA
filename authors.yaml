# Cornell Extreme Astrophysics — tracked ADS authors
# ----------------------------------------------------
# update_publications.py reads this file to know whose papers to pull
# from NASA ADS. To add someone new:
#
#   1. Go to https://ui.adsabs.harvard.edu, search their name, click
#      their name in the author-facet sidebar to filter to just them
#      (this is what disambiguates "your" Smith, J. from every other
#      Smith, J. on ADS).
#   2. Copy the full URL from your browser's address bar.
#   3. Add a new "- name: ... / url: ..." entry below, in this exact
#      two-line shape (this file is read by a small parser, not a
#      full YAML library, so stick to this shape).
#
# Run `python3 update_publications.py --token YOUR_ADS_TOKEN` after
# adding someone — it pulls everyone below in one pass.

authors:
  - name: James M. Cordes
    url: "https://ui.adsabs.harvard.edu/search/filter_author_facet_hier_fq_author=AND&filter_author_facet_hier_fq_author=author_facet_hier%3A%221%2FCordes%2C%20J%2FCordes%2C%20James%20M%22&fq=%7B!type%3Daqp%20v%3D%24fq_author%7D&fq_author=(author_facet_hier%3A%221%2FCordes%2C%20J%2FCordes%2C%20James%20M%22)&q=%20author%3A%22james%20cordes%22&sort=date%20desc%2C%20bibcode%20desc&p_=0"

